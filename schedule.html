<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сессии - Olo'Kafu'áng</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        .container { max-width: 1100px; margin: 40px auto; padding: 20px; position: relative; z-index: 10; }
        .page-title { text-align: center; margin-bottom: 40px; font-size: 2.5rem; }
        .sessions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .session-card { background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: 15px; padding: 25px; backdrop-filter: blur(10px); transition: transform 0.3s; }
        .session-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; border-bottom: 1px solid rgba(0,229,255,0.1); padding-bottom: 10px; }
        .session-title { font-size: 1.2rem; color: var(--accent-blue); font-weight: 600; }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .status-planned { background: rgba(0, 229, 255, 0.15); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
        .status-completed { background: rgba(124, 245, 179, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .session-info { margin-bottom: 15px; font-size: 0.95rem; color: var(--text-muted); }
        .session-slots { margin-bottom: 20px; font-size: 1.1rem; color: var(--accent-amber); text-align: center; padding: 10px; background: rgba(255,183,77,0.1); border-radius: 10px; }
        .join-btn { width: 100%; text-align: center; display: block; border: none; cursor: pointer; }
        .join-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    
    <nav class="navbar">
        <div class="logo">
            <img src="assets/logo.svg" alt="Эйва" class="glow-icon">
            <span class="clan-name-text font-orbitron text-glow"></span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Главная</a></li>
            <li><a href="schedule.html" class="active">Сессии</a></li>
            <li><a href="clan.html">Клан</a></li>
            <li><a href="info.html">Инфо</a></li>
            <li><a href="admin.html" class="admin-link">Админка</a></li>
        </ul>
    </nav>

    <main class="container fade-in">
        <h1 class="page-title font-cinzel neon-text">Боевое расписание</h1>
        <div class="sessions-grid" id="sessions-container">
            <!-- Сюда JS загрузит карточки сессий -->
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/main.js"></script>
    <script src="js/schedule.js"></script>
</body>
</html>
