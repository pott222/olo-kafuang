<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Состав - Olo'Kafu'áng</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        .container { max-width: 1200px; margin: 40px auto; padding: 20px; position: relative; z-index: 10; }
        .stats-banner { background: rgba(0, 229, 255, 0.1); border: 1px solid var(--accent-blue); padding: 15px 30px; border-radius: 15px; display: flex; justify-content: space-between; margin-bottom: 40px; box-shadow: 0 0 15px rgba(0,229,255,0.2); }
        .stats-banner div { font-size: 1.2rem; font-family: 'Orbitron', sans-serif; }
        .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .member-card { background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: 15px; padding: 30px 20px; text-align: center; transition: all 0.3s; position: relative; overflow: hidden; backdrop-filter: blur(10px); }
        .member-avatar { font-size: 4rem; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(124, 245, 179, 0.5)); }
        .member-name { font-size: 1.4rem; color: #fff; margin-bottom: 5px; }
        .member-rank { color: var(--accent-cyan); font-size: 0.9rem; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
        .status-online { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .status-offline { background: #555; }
        .status-reserve { background: var(--accent-amber); box-shadow: 0 0 10px var(--accent-amber); }
        .member-joined { font-size: 0.8rem; color: #777; margin-top: 15px; }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    
    <nav class="navbar">
        <div class="logo">
            <img src="assets/logo.svg" alt="Эйва" class="glow-icon">
            <span class="clan-name-text font-orbitron text-glow"></span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Главная</a></li>
            <li><a href="schedule.html">Сессии</a></li>
            <li><a href="clan.html" class="active">Клан</a></li>
            <li><a href="info.html">Инфо</a></li>
            <li><a href="admin.html" class="admin-link">Админка</a></li>
        </ul>
    </nav>

    <main class="container fade-in">
        <div class="stats-banner">
            <div id="stat-total">Всего братьев и сестер: <span>0</span></div>
            <div id="stat-online">Связь с Эйвой (Онлайн): <span style="color: var(--accent-green)">0</span></div>
        </div>
        <div class="members-grid" id="members-container"></div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/main.js"></script>
    <script src="js/clan.js"></script>
</body>
</html>
