<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инфо - Olo'Kafu'áng</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- Анимация семян Эйвы на фоне -->
    <canvas id="particles-canvas"></canvas>
    
    <nav class="navbar">
        <div class="logo">
            <!-- Если ты переименовал логотип в hand.png, поменяй тут logo.svg на hand.png -->
            <img src="assets/logo.svg" alt="Эйва" class="glow-icon">
            <span class="clan-name-text font-orbitron text-glow"></span>
        </div>
        
        <!-- Кнопка мобильного меню (бургер) -->
        <div class="burger">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Главная</a></li>
            <li><a href="schedule.html">Сессии</a></li>
            <li><a href="clan.html">Клан</a></li>
            <li><a href="info.html" class="active">Инфо</a></li>
            <li><a href="admin.html" class="admin-link">Админка</a></li>
        </ul>
    </nav>

    <main class="container fade-in" style="position: relative; z-index: 10;">
        <div class="info-content glow-box" style="background: var(--bg-card); border-radius: 15px; border: 1px solid var(--glass-border); padding: 40px; margin-top: 50px;">
            
            <h1 class="font-cinzel neon-text" style="text-align: center; margin-bottom: 30px;">Священные Знания Клана</h1>
            
            <!-- Блок с описанием клана (подтягивается из настроек) -->
            <section class="clan-info-section" style="margin-bottom: 40px;">
                <h2 class="font-orbitron" style="color: var(--accent-green); margin-bottom: 15px;">О нас</h2>
                <p class="clan-desc-text" style="line-height: 1.6; color: #ddd;"></p>
            </section>

            <!-- Блок с правилами (подтягивается из админки) -->
            <section class="rules-section">
                <h2 class="font-orbitron" style="color: var(--accent-green); margin-bottom: 15px;">Свод Правил Эйвы</h2>
                <ul id="rules-container" class="rules-list" style="color: #ddd; line-height: 1.8; padding-left: 20px;">
                    <!-- Заглушка, пока скрипт загружает правила -->
                    <li>Эйва собирает правила...</li>
                </ul>
            </section>
            
        </div>
    </main>

    <!-- Подключаем только базовые скрипты, БЕЗ admin.js -->
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
