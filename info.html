<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инфо - Olo'Kafu'áng</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        .container { max-width: 800px; margin: 40px auto; padding: 40px; background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: 15px; position: relative; z-index: 10; backdrop-filter: blur(10px); }
        .page-title { text-align: center; margin-bottom: 40px; font-size: 2.5rem; }
        .info-section { margin-bottom: 40px; }
        .info-section h2 { color: var(--accent-green); margin-bottom: 20px; font-family: 'Orbitron', sans-serif; border-bottom: 1px solid rgba(124, 245, 179, 0.2); padding-bottom: 10px; }
        .rules-list { list-style: none; padding-left: 0; }
        .rules-list li { margin-bottom: 15px; padding-left: 25px; position: relative; font-size: 1.1rem; line-height: 1.6; }
        .rules-list li::before { content: '🌿'; position: absolute; left: 0; top: 2px; font-size: 1rem; }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    
    <nav class="navbar">
        <div class="logo">
            <img src="assets/logo.svg" alt="Эйва" class="glow-icon">
            <span class="clan-name-text font-orbitron text-glow"></span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Главная</a></li>
            <li><a href="schedule.html">Сессии</a></li>
            <li><a href="clan.html">Клан</a></li>
            <li><a href="info.html" class="active">Инфо</a></li>
            <li><a href="admin.html" class="admin-link">Админка</a></li>
        </ul>
    </nav>

    <main class="container fade-in glow-box">
        <h1 class="page-title font-cinzel neon-text">Путь клана</h1>
        
        <div class="info-section">
            <h2>О нас</h2>
            <p class="clan-desc-text" style="line-height: 1.6; font-size: 1.1rem;"></p>
        </div>

        <section class="rules-section">
    <h2 class="neon-text">Свод Правил Эйвы</h2>
    <ul id="rules-container" class="rules-list">
        <!-- Сюда наш скрипт будет автоматически подтягивать правила -->
        <li>Правила пока не установлены...</li>
    </ul>
</section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const data = StorageManager.get();
            const rulesList = document.getElementById("rules-list");
            
            data.rules.forEach(rule => {
                const li = document.createElement("li");
                li.textContent = rule;
                rulesList.appendChild(li);
            });
        });
    </script>
</body>
</html>
